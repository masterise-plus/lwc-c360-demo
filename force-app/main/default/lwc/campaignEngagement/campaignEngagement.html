<template>
    <lightning-card title="Campaign Engagement" icon-name="standard:campaign">
        <div slot="actions">
            <lightning-button
                label="Select Fields"
                icon-name="utility:settings"
                onclick={openFieldSelector}
                variant="neutral"
                disabled={isLoading}>
            </lightning-button>
        </div>

        <div class="slds-card__body slds-card__body_inner slds-is-relative">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
            </template>

            <template if:false={currentRecordId}>
                <p class="slds-text-body_small slds-m-around_medium slds-text-align_center slds-text-color_weak">
                    Select a customer to view campaign engagement data.
                </p>
            </template>

            <template if:true={currentRecordId}>
                <template if:true={noData}>
                    <p class="slds-text-body_small slds-m-around_medium slds-text-align_center slds-text-color_weak">
                        No campaign engagement found for this individual.
                    </p>
                </template>

                <template if:true={hasData}>
                    <div class="slds-m-top_small">
                        <lightning-datatable
                            key-field="id__c"
                            show-row-number-column
                            hide-checkbox-column
                            data={visibleSalesOrderItem}
                            columns={displayColumns}
                            sorted-direction={sortDirection}
                            sorted-by={sortedBy}
                            onsort={onHandleSort}>
                        </lightning-datatable>
                    </div>

                    <div class="slds-m-top_small slds-align_absolute-center" if:true={canShowMore}>
                        <lightning-button
                            label="Show More"
                            variant="neutral"
                            onclick={openAllDataModal}>
                        </lightning-button>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>

    <template if:true={isFieldModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">Select Display Fields</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-dual-listbox
                        label="Visible Fields"
                        source-label="Available"
                        selected-label="Displayed"
                        options={availableFields}
                        value={tempSelectedFields}
                        onchange={handleFieldChange}>
                    </lightning-dual-listbox>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeFieldModal}></lightning-button>
                    <lightning-button label="Apply" variant="brand" onclick={applyFieldSelection} class="slds-m-left_small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={isAllDataModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container modal-container-1000">
                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">All Campaign Engagement</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-datatable
                        key-field="id__c"
                        show-row-number-column
                        hide-checkbox-column
                        data={modalPagedData}
                        columns={displayColumns}
                        sorted-direction={sortDirection}
                        sorted-by={sortedBy}
                        onsort={onHandleSort}>
                    </lightning-datatable>
                </div>
                <footer class="slds-modal__footer slds-grid slds-grid_align-spread">
                    <div>
                        <lightning-button label="Previous" onclick={handleModalPrev} disabled={canModalPrev}></lightning-button>
                        <span class="slds-m-horizontal_medium">Page {modalCurrentPage} of {modalTotalPages}</span>
                        <lightning-button label="Next" onclick={handleModalNext} disabled={canModalNext}></lightning-button>
                    </div>
                    <lightning-button label="Close" variant="neutral" onclick={closeAllDataModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
