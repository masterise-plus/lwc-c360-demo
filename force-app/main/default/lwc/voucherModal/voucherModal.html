<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading" class="slds-modal slds-fade-in-open slds-modal_medium">
        <div class="slds-modal__container">
            <!-- Modal Header -->
            <header class="slds-modal__header modal-header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="Close" size="small" class="close-icon"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading" class="slds-modal__title modal-title">
                    <lightning-icon icon-name="standard:opportunity" size="small" class="header-icon"></lightning-icon>
                    <span>All Vouchers & Benefits</span>
                </h2>
            </header>

            <!-- Modal Body -->
            <div class="slds-modal__content modal-content" id="modal-content">
                <div class="voucher-list">
                    <template for:each={vouchers} for:item="voucher">
                        <div key={voucher.id} class="voucher-card">
                            <!-- Banner Section -->
                            <div class="voucher-banner">
                                <div class="banner-content">
                                    <div class="brand-name">{voucher.brand}</div>
                                    <template if:true={voucher.serviceType}>
                                        <div class="service-badge">{voucher.serviceType}</div>
                                    </template>
                                    <div class="discount-badge">{voucher.discountLabel}</div>
                                    <template if:true={voucher.subtitle}>
                                        <div class="voucher-subtitle">{voucher.subtitle}</div>
                                    </template>
                                </div>
                                <div class="banner-image">
                                    <template if:true={voucher.hasImage}>
                                        <img src={voucher.bannerImage} alt={voucher.title} class="voucher-img" />
                                    </template>
                                </div>
                            </div>

                            <!-- Info Section -->
                            <div class="voucher-info">
                                <div class="voucher-details">
                                    <div class="voucher-title">{voucher.title}</div>
                                    <div class="expiration-row">
                                        <lightning-icon icon-name="utility:clock" size="xx-small" class="clock-icon"></lightning-icon>
                                        <span class="expiration-label">Expiration date</span>
                                    </div>
                                    <div class="expiration-date">
                                        <lightning-icon icon-name="utility:clock" size="xx-small" class="clock-icon-hidden"></lightning-icon>
                                        <span>{voucher.expirationDate}</span>
                                    </div>
                                </div>
                                <div class="voucher-action">
                                    <button class="apply-button" data-id={voucher.id} onclick={handleApply}>Apply</button>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template if:false={hasVouchers}>
                        <div class="empty-state">
                            <lightning-icon icon-name="utility:info" size="large" class="empty-icon"></lightning-icon>
                            <p>No vouchers available at the moment.</p>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Modal Footer -->
            <footer class="slds-modal__footer modal-footer">
                <button class="close-button" onclick={handleClose}>Close</button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" onclick={handleBackdropClick}></div>
</template>
