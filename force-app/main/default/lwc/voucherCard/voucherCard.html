<template>
    <lightning-card title="Voucher & Benefits" icon-name="standard:opportunity">
        <!-- Voucher List -->
        <template if:true={hasVouchers}>
            <div class="voucher-list">
                <template for:each={displayedVouchers} for:item="voucher">
                    <div key={voucher.id} class="voucher-card">
                    <!-- Banner Section -->
                    <div class="voucher-banner">
                        <div class="banner-content">
                            <div class="brand-name">{voucher.brand}</div>
                            <template if:true={voucher.serviceType}>
                                <div class="service-badge">{voucher.serviceType}</div>
                            </template>
                            <div class="discount-badge">{voucher.discountLabel}</div>
                            <template if:true={voucher.subtitle}>
                                <div class="voucher-subtitle">{voucher.subtitle}</div>
                            </template>
                        </div>
                        <div class="banner-image">
                            <template if:true={voucher.hasImage}>
                                <img src={voucher.bannerImage} alt={voucher.title} class="voucher-img" />
                            </template>
                        </div>
                    </div>

                    <!-- Info Section -->
                    <div class="voucher-info">
                        <div class="voucher-details">
                            <div class="voucher-title">{voucher.title}</div>
                            <div class="expiration-row">
                                <lightning-icon icon-name="utility:clock" size="xx-small" class="clock-icon"></lightning-icon>
                                <span class="expiration-label">Expiration date</span>
                            </div>
                            <div class="expiration-date">
                                <lightning-icon icon-name="utility:clock" size="xx-small" class="clock-icon-hidden"></lightning-icon>
                                <span>{voucher.expirationDate}</span>
                            </div>
                        </div>
                        <div class="voucher-action">
                            <button class="apply-button" data-id={voucher.id} onclick={handleApply}>Apply</button>
                        </div>
                    </div>
                </div>
            </template>
            </div>
        </template>

        <!-- Empty State -->
        <template if:false={hasVouchers}>
            <div class="empty-state">
                <lightning-icon icon-name="utility:info" size="large" class="empty-icon"></lightning-icon>
                <p>No voucher information available.</p>
            </div>
        </template>

        <!-- Show More Button -->
        <template if:true={hasMoreVouchers}>
            <div class="show-more-container">
                <button class="show-more-button" onclick={handleShowMore}>Show More</button>
            </div>
        </template>

        <!-- Modal -->
        <template if:true={isModalOpen}>
            <c-voucher-modal 
                vouchers={allVouchers} 
                onclose={handleCloseModal}
                onapply={handleModalApply}>
            </c-voucher-modal>
        </template>
    </lightning-card>
</template>
