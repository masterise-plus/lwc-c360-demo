<template>
    <div class="carousel-container">
        <div class="carousel-header">
            <span class="header-title">Campaign & Promo</span>
        </div>
        
        <div class="carousel-wrapper">
            <div class="carousel-track" 
                 ontouchstart={handleTouchStart} 
                 ontouchmove={handleTouchMove} 
                 ontouchend={handleTouchEnd}
                 onmousedown={handleMouseDown}
                 onmousemove={handleMouseMove}
                 onmouseup={handleMouseUp}
                 onmouseleave={handleMouseUp}
                 style={trackStyle}>
                <template for:each={promoItems} for:item="item">
                    <div key={item.id} class="carousel-slide">
                        <div class="promo-card" style={item.cardStyle}>
                            <template if:true={item.badge}>
                                <div class="promo-badge" style={item.badgeStyle}>
                                    <img src={item.badgeIcon} alt="badge" class="badge-icon" />
                                    <span class="badge-text">{item.badge}</span>
                                </div>
                            </template>
                            
                            <div class="promo-content">
                                <template if:true={item.logo}>
                                    <div class="promo-logo">{item.logo}</div>
                                </template>
                                
                                <h3 class="promo-title">{item.title}</h3>
                                
                                <template if:true={item.subtitle}>
                                    <p class="promo-subtitle">{item.subtitle}</p>
                                </template>
                                
                                <div class="promo-price">
                                    <span class="price-currency">Rp</span>
                                    <span class="price-value">{item.price}</span>
                                </div>
                            </div>
                            
                            <template if:true={item.image}>
                                <div class="promo-image">
                                    <img src={item.image} alt={item.title} />
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
        
        <div class="carousel-indicators">
            <template for:each={indicators} for:item="indicator">
                <button 
                    key={indicator.index}
                    class={indicator.className}
                    data-index={indicator.index}
                    onclick={handleIndicatorClick}>
                </button>
            </template>
        </div>
    </div>
</template>
