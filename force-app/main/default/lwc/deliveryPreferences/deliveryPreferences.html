<template>
    <lightning-card title="Delivery Preferences" icon-name="standard:shipment">
        <!-- Loading State -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>

        <!-- Metrics Grid - Show only when data is available -->
        <template if:true={hasData}>
            <div class="metrics-grid">
                <!-- Total Pickup Orders -->
                <div class="metric-card">
                    <div class="metric-label">Total Pickup Orders</div>
                    <div class="metric-value-row">
                        <div class="metric-icon pickup-icon">
                            <lightning-icon icon-name="utility:bundle_config" size="small"></lightning-icon>
                        </div>
                        <span class="metric-value">{totalPickupOrders}</span>
                    </div>
                </div>

                <!-- Total Home Deliveries -->
                <div class="metric-card">
                    <div class="metric-label">Total Home Deliveries</div>
                    <div class="metric-value-row">
                        <div class="metric-icon delivery-icon">
                            <lightning-icon icon-name="utility:package" size="small"></lightning-icon>
                        </div>
                        <span class="metric-value">{totalHomeDeliveries}</span>
                    </div>
                </div>

                <!-- Avg. Delivery Time -->
                <div class="metric-card">
                    <div class="metric-label">Avg. Delivery Time (min)</div>
                    <div class="metric-value-row">
                        <div class="metric-icon time-icon">
                            <lightning-icon icon-name="utility:clock" size="small"></lightning-icon>
                        </div>
                        <span class="metric-value">{avgDeliveryTime}</span>
                    </div>
                </div>

                <!-- Order Satisfaction -->
                <div class="metric-card">
                    <div class="metric-label">Order Satisfaction (%)</div>
                    <div class="metric-value-row">
                        <div class="metric-icon satisfaction-icon">
                            <lightning-icon icon-name="utility:smiley_and_people" size="small"></lightning-icon>
                        </div>
                        <span class="metric-value">{orderSatisfaction}</span>
                    </div>
                </div>
            </div>
        </template>

        <!-- Empty State - Show when no record is selected -->
        <template if:false={hasData}>
            <template if:false={isLoading}>
                <div class="empty-state">
                    <lightning-icon icon-name="utility:info" size="large" class="empty-icon"></lightning-icon>
                    <p>No delivery preferences data available.</p>
                </div>
            </template>
        </template>
    </lightning-card>
</template>
