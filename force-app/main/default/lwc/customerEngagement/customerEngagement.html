<template>
    <lightning-card title="Engagement" icon-name="standard:outcome_activity">

        <!-- Header Actions -->
        <div slot="actions" class="actions">
            <lightning-button-icon
                icon-name="utility:filterList"
                alternative-text="Filter engagement"
                title="Filter engagement"
                onclick={openFilterModal}
                variant="bare"
                disabled={isLoading}
            ></lightning-button-icon>

            <lightning-button-icon
                icon-name="utility:refresh"
                alternative-text="Refresh engagement"
                title="Refresh engagement"
                onclick={handleRefresh}
                variant="bare"
                disabled={isLoading}
            ></lightning-button-icon>
        </div>

        <!-- Loading -->
        <template if:true={isLoading}>
            <div class="spinner-overlay">
                <lightning-spinner alternative-text="Loading engagement data"></lightning-spinner>
            </div>
        </template>

        <!-- Timeline Preview (max 3) -->
        <template if:true={visibleEngagements.length}>
            <div class="timeline">
                <template for:each={visibleEngagements} for:item="item">
                    <div key={item.key} class="timeline-item">
                        <div class="icon" title={item.eventName}>
                            <lightning-icon icon-name={item.iconName} size="small"></lightning-icon>
                        </div>

                        <div class="content">
                            <div class="title">{item.eventName}</div>

                            <div class="border-line">
                                <div class="desc">
                                    <span class="value">{item.eventDescription}</span>
                                </div>

                                <div class="badge-row">
                                    <span class="label">Business Unit:</span>
                                    <lightning-badge class="bu-badge" label={item.businessunits}></lightning-badge>
                                </div>

                                <div class="time-container">
                                    <span>
                                        <lightning-icon icon-name="utility:clock" size="xx-small"></lightning-icon>
                                    </span>
                                    <span class="time"> {item.timeElapsed}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Show More Button -->
            <div class="slds-m-top_small slds-align_absolute-center">
                <template if:true={canShowMore}>
                    <lightning-button
                        label="Show More"
                        variant="neutral"
                        onclick={openAllDataModal}>
                    </lightning-button>
                </template>
            </div>
        </template>

        <!-- Error -->
        <template if:true={error}>
            <div class="error">⚠️ {error}</div>
        </template>

        <!-- ================= -->
        <!-- FILTER MODAL -->
        <!-- ================= -->
        <template if:true={isFilterModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Filter Engagement</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-combobox
                            name="eventType"
                            label="Event Type"
                            value={draftFilters.eventType}
                            options={eventTypeOptions}
                            onchange={handleFilterChange}
                        ></lightning-combobox>

                        <lightning-combobox
                            class="slds-m-top_small"
                            name="bu"
                            label="Business Unit"
                            value={draftFilters.bu}
                            options={buOptions}
                            onchange={handleFilterChange}
                        ></lightning-combobox>

                        <lightning-input
                            class="slds-m-top_small"
                            type="text"
                            name="keyword"
                            label="Keyword"
                            placeholder="Search event name/description..."
                            value={draftFilters.keyword}
                            onchange={handleFilterChange}
                        ></lightning-input>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Clear"
                            variant="neutral"
                            onclick={clearFilters}
                        ></lightning-button>

                        <lightning-button
                            class="slds-m-left_small"
                            label="Cancel"
                            variant="neutral"
                            onclick={closeFilterModal}
                        ></lightning-button>

                        <lightning-button
                            class="slds-m-left_small"
                            label="Apply"
                            variant="brand"
                            onclick={applyFilters}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- ================= -->
        <!-- ALL DATA MODAL -->
        <!-- ================= -->
        <template if:true={isAllDataModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_large">
                <div class="slds-modal__container">

                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">All Engagement</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <template if:true={filteredEngagements.length}>
                            <div class="timeline">
                                <template for:each={filteredEngagements} for:item="item">
                                    <div key={item.key} class="timeline-item">
                                        <div class="icon" title={item.eventName}>
                                            <lightning-icon icon-name={item.iconName} size="small"></lightning-icon>
                                        </div>

                                        <div class="content">
                                            <div class="title">{item.eventName}</div>

                                            <div class="border-line">
                                                <div class="desc">
                                                    <span class="value">{item.eventDescription}</span>
                                                </div>

                                                <div class="badge-row">
                                                    <span class="label">Business Unit:</span>
                                                    <lightning-badge class="bu-badge" label={item.businessunits}></lightning-badge>
                                                </div>

                                                <div class="time-container">
                                                    <span>
                                                        <lightning-icon icon-name="utility:clock" size="xx-small"></lightning-icon>
                                                    </span>
                                                    <span class="time"> {item.timeElapsed}</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <template if:false={filteredEngagements.length}>
                            <p class="slds-text-body_small">No engagement found for the selected filter.</p>
                        </template>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Close"
                            variant="neutral"
                            onclick={closeAllDataModal}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
