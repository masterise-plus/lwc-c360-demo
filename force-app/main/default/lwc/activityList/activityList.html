<template>
    <lightning-card title="Customer Transaction List" icon-name="standard:webcart">

        <div slot="actions" class="slds-m-around_small">
            <lightning-button
                label="Select Fields"
                icon-name="utility:settings"
                onclick={openFieldSelector}
                variant="neutral">
            </lightning-button>
        </div>

        <template if:true={isLoading}>
            <div class="slds-is-relative slds-p-around_large">
                <lightning-spinner alternative-text="Loading transaction..." size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="slds-text-color_error slds-p-around_small slds-align_absolute-center">
                <lightning-icon icon-name="utility:error" variant="error" size="small" class="slds-m-right_x-small"></lightning-icon>
                {error}
            </div>
        </template>

        <template if:false={noData}>
            <template if:false={isLoading}>
                <div class="slds-p-horizontal_medium">
                    <lightning-datatable 
                        class="table_luar"
                        key-field="Sales_Order_Id"
                        show-row-number-column
                        hide-checkbox-column
                        data={visibleSalesOrder}
                        columns={displayColumns}
                        sorted-direction={sortDirection}
                        sorted-by={sortedBy}
                        onsort={onHandleSort}>
                    </lightning-datatable>
                </div>

                <div class="slds-m-top_small slds-align_absolute-center">
                    <template if:true={canShowMore}>
                        <lightning-button
                            label="Show More"
                            variant="neutral"
                            onclick={openAllDataModal}>
                        </lightning-button>
                    </template>
                </div>
            </template>
        </template>

        <template if:true={noData}>
            <div class="slds-text-align_center slds-p-around_medium slds-text-color_weak">
                <p>No transactions found for this individual.</p>
            </div>
        </template>

        <template if:true={isFieldModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Select Fields to Display</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-dual-listbox
                            label="Visible Fields"
                            source-label="Available Fields"
                            selected-label="Displayed Fields"
                            options={availableFields}
                            value={tempSelectedFields}
                            onchange={handleTempFieldSelection}>
                        </lightning-dual-listbox>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeFieldModal}></lightning-button>
                        <lightning-button label="Save" variant="brand" class="slds-m-left_small" onclick={applyFieldSelection}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>

    <template if:true={isAllDataModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-center">
                        <lightning-icon 
                            icon-name="standard:webcart" 
                            size="medium" 
                            class="slds-m-right_small">
                        </lightning-icon>
                        <h2 class="slds-text-heading_medium">All Customer Transaction List</h2>
                    </div>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-datatable
                        key-field="Sales_Order_Id"
                        show-row-number-column
                        hide-checkbox-column
                        data={modalPagedData}
                        columns={displayColumns}
                        sorted-direction={sortDirection}
                        sorted-by={sortedBy}
                        onsort={onHandleSort}>
                    </lightning-datatable>
                </div>

                <footer class="slds-modal__footer slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <lightning-button
                            label="Previous"
                            icon-name="utility:chevronleft"
                            onclick={handleModalPrev}
                            disabled={canModalPrev}>
                        </lightning-button>

                        <span class="slds-m-horizontal_medium">
                            Page <strong>{modalCurrentPage}</strong> of <strong>{modalTotalPages}</strong>
                        </span>

                        <lightning-button
                            label="Next"
                            icon-name="utility:chevronright"
                            icon-position="right"
                            onclick={handleModalNext}
                            disabled={canModalNext}>
                        </lightning-button>
                    </div>

                    <lightning-button
                        label="Close"
                        variant="neutral"
                        onclick={closeAllDataModal}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
