<template>
    <lightning-card title="Customer Transaction List" icon-name="standard:webcart">
        <!-- Header: Select Fields -->
        <div slot="actions" class="slds-m-around_small">
            <lightning-button
                label="Select Fields"
                icon-name="utility:settings"
                onclick={openFieldSelector}
                variant="neutral"
                class="header-select-button">
            </lightning-button>
        </div>

        <!-- Spinner -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading transactions..."></lightning-spinner>
        </template>

        <!-- Error -->
        <template if:true={error}>
            <div class="slds-text-color_error slds-p-around_small">{error}</div>
        </template>

        <!-- Data Table -->
        <template if:true={salesorder}>
            <div class="datatable-wrapper">
                <lightning-datatable
                    key-field="Sales_Order_Id"
                    show-row-number-column
                    hide-checkbox-column
                    data={visibleSalesOrder}
                    columns={displayColumns}
                    default-sort-direction={defaultSortDirection}
                    sorted-direction={sortDirection}
                    sorted-by={sortedBy}
                    onsort={onHandleSort}>
                </lightning-datatable>
            </div>

            <!-- Pagination -->
            <div class="slds-m-top_small slds-align_absolute-center">
                <template if:true={canShowMore}>
                    <lightning-button
                        label="Show More"
                        variant="neutral"
                        onclick={handleShowMore}>
                    </lightning-button>
                </template>
                <template if:true={canShowLess}>
                    <lightning-button
                        label="Show Less"
                        variant="neutral"
                        onclick={handleShowLess}>
                    </lightning-button>
                </template>
            </div>
        </template>

        <!-- No Data -->
        <template if:true={noData}>
            <p class="slds-text-body_small slds-m-around_medium">
                No transaction found for this individual.
            </p>
        </template>

        <!-- Field Selector Modal -->
        <template if:true={isFieldModalOpen}>
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">

                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Select Fields to Display</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-dual-listbox
                            name="visibleFields"
                            label="Visible Fields"
                            source-label="Available Fields"
                            selected-label="Displayed Fields"
                            field-level-help="Choose and reorder the columns you want to see in the table"
                            options={availableFields}
                            value={tempSelectedFields}
                            onchange={handleTempFieldSelection}>
                        </lightning-dual-listbox>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeFieldModal}></lightning-button>
                        <lightning-button variant="brand" label="Save" class="slds-m-left_small" onclick={applyFieldSelection}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
